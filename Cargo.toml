[package]
name = "assumer"
version = "1.0.6"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "assumer"
path = "src/main.rs"

[dependencies]
color-eyre = "0.6.5"
ratatui = "0.30.2"
aws-config = { version = "1.11.0", features = ["behavior-version-latest"] }
aws-sdk-sso = "1.108.0"
aws-sdk-ssooidc = "^1.110.0"
aws-types = "1.5.0"
tokio = { version = "1.53.1", features = ["full"] }
directories = "6.0.0"
anyhow = "1.0.104"
rust-ini = "0.21.3"
serde = { version = "1.0.229",  features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
sha1 = "0.11.0"
open = "5.4.3"
http = "1.5.0"
reqwest = { version = "0.13.4", features = ["query"] }
serde_urlencoded = "0.7.1"
webbrowser = "1.2.4"
urlencoding = "2.1.3"
log = "0.4.34"
env_logger = "0.11.11"
