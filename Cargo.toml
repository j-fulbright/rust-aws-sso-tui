[package]
name = "assumer"
version = "1.0.5"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "assumer"
path = "src/main.rs"

[dependencies]
color-eyre = "0.6.5"
ratatui = "0.29.0"
aws-config = { version = "1.8.5", features = ["behavior-version-latest"] }
aws-sdk-sso = "1.81.0"
aws-sdk-ssooidc = "^1.10.0"
aws-types = "1.1.2"
tokio = { version = "1", features = ["full"] }
directories = "6.0.0"
anyhow = "1.0.99"
rust-ini = "0.21.2"
serde = { version = "1.0.195",  features = ["derive"] }
serde_json = "1.0.142"
chrono = "0.4.41"
sha1 = "0.10.6"
open = "5.3.2"
http = "1.3.1"
reqwest = "0.12.23"
serde_urlencoded = "0.7.1"
webbrowser = "1.0.5"
urlencoding = "2.1.3"
log = "0.4"
env_logger = "0.11"
